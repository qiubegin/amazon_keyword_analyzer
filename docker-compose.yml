services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amazon-keyword-backend
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5002
    volumes:
      - ./processed_data:/app/processed_data:ro
      - ./translation_rules:/app/translation_rules:ro
      - ./filter_rules:/app/filter_rules:ro
    expose:
      - "5002"

  frontend:
    build:
      context: ./frontend_keyword_demo
      dockerfile: Dockerfile
    container_name: amazon-keyword-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8050:80"
